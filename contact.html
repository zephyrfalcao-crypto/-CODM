<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CODM - Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <aside class="menu">
        <a href="CODM.html" class="logo">CODM</a>
        <nav>
            <a href="CODM.html">Accueil</a>
            <a href="modes.html">Modes de jeu</a>
            <a href="armes.html">Armes et opérateurs</a>
            <a href="cartes.html">Cartes et saisons</a>
            <a href="contact.html" class="active" aria-current="page">Contact</a>
        </nav>
        <a href="https://play.google.com/store/apps/details?id=com.activision.callofduty.shooter" target="_blank" rel="noopener" class="bouton contour">Télécharger</a>
    </aside>

    <main>
        <section class="contenu">
            <p class="etiquette">// Contact</p>
            <h1>Une question ?</h1>
            <p style="margin-bottom: 28px;">Écris-nous un message, nous te répondrons dès que possible.</p>

            <form class="formulaire" id="formulaire">
                <div>
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <div>
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="bouton">Envoyer</button>
            </form>

            <p class="confirmation" id="confirmation" hidden>Message envoyé, merci !</p>
        </section>
    </main>

    <footer>
        Projet universitaire, site non officiel. Call of Duty: Mobile © Activision.
    </footer>

    <script>
        document.getElementById("formulaire").addEventListener("submit", function(e) {
            e.preventDefault();
            this.reset();
            document.getElementById("confirmation").hidden = false;
        });
    </script>

</body>

</html>
